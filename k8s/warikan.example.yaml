# pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: default
  labels:
    app: api
    env: production
spec:
  containers:
    - name: api
      image: kix.ocir.io/axndtqaclmcm/api-image:v6
      resources:
        requests:
          memory: "256Mi"
          cpu: "500m"
        limits:
          memory: "1024Mi"
          cpu: "1000m"
      env:
        - name: SECRET_ID
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: SECRET_ID
      imagePullPolicy: "IfNotPresent"
  imagePullSecrets:
    - name: docker-secret

---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: default
  labels:
    app: web
    env: production
spec:
  containers:
    - name: web
      image: kix.ocir.io/axndtqaclmcm/web-image:v9
      resources:
        requests:
          memory: "256Mi"
          cpu: "500m"
        limits:
          memory: "1024Mi"
          cpu: "1000m"
      env:
        - name: LINE_CHANNEL_ID
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: LINE_CHANNEL_ID
        - name: LINE_CHANNEL_SECRET
          valueFrom:
            secretKeyRef:
              name: secret
              key: LINE_CHANNEL_SECRET
        - name: NEXT_PUBLIC_SPECIFIEDLINEUSER1
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: NEXT_PUBLIC_SPECIFIEDLINEUSER1
        - name: NEXT_PUBLIC_SPECIFIEDLINEUSER1_NAME
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: NEXT_PUBLIC_SPECIFIEDLINEUSER1_NAME
        - name: NEXT_PUBLIC_SPECIFIEDLINEUSER2
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: NEXT_PUBLIC_SPECIFIEDLINEUSER2
        - name: NEXT_PUBLIC_SPECIFIEDLINEUSER2_NAME
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: NEXT_PUBLIC_SPECIFIEDLINEUSER2_NAME
        - name: NEXTAUTH_URL
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: NEXTAUTH_URL
        - name: APIENDPOINT
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: APIENDPOINT
        - name: GOOGLEGENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: secret
              key: GOOGLEGENAI_API_KEY
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: secret
              key: NEXTAUTH_SECRET
        - name: GOOGLE_APPLICATION_CREDENTIALS
          valueFrom:
            configMapKeyRef:
              name: config-map
              key: GOOGLE_APPLICATION_CREDENTIALS
      volumeMounts:
        - name: secret-volume
          mountPath: /home/warikan/src/app/home/register-receipt/
      imagePullPolicy: "Always"
  volumes:
    - name: secret-volume
      secret:
        secretName: secret
        items:
          - key: GOOGLEAPI_SECRET_FILE
            path: extended-bongo-458208-n0-c5485eb05fd4.json
  imagePullSecrets:
    - name: docker-secret

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: api
    env: production
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-lb
  namespace: default
  annotations:
    oci.oraclecloud.com/load-balancer-type: "lb"
    service.beta.kubernetes.io/oci-load-balancer-ssl-ports: "443"
    oci-load-balancer.oraclecloud.com/health-check: '{"protocol": "HTTP", "port": 3000, "urlPath": "/signIn", "returnCode":307 , "retries": 3, "timeoutInMillis": 4000}'
    oci.oraclecloud.com/reserved-ips: "" # 事前に予約したIPアドレス
    service.beta.kubernetes.io/oci-load-balancer-subnet1: "" # LBを置くパブリックサブネット
    service.beta.kubernetes.io/oci-load-balancer-security-rule-management-mode: NSG
    service.beta.kubernetes.io/oci-load-balancer-internal: "false" # インターネットからアクセス可能なLBにする
    service.beta.kubernetes.io/oci-load-balancer-tls-secret: ssl-certificate-secret-expired-aug
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "1"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
    oci.oraclecloud.com/oci-load-balancer-listener-ssl-config: '{"CipherSuiteName":"oci-tls-12-13-wider-ssl-cipher-suite-v1","Protocols":["TLSv1.2","TLSv1.3"]}'
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: true
  selector:
    app: web
    env: production
  ports:
    - name: https
      port: 443
      targetPort: 3000
    - name: http
      port: 80
      targetPort: 3000
    - name: app
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map
  namespace: default
data:
  SECRET_ID: ""
  LINE_CHANNEL_ID: ""
  NEXT_PUBLIC_SPECIFIEDLINEUSER1: ""
  NEXT_PUBLIC_SPECIFIEDLINEUSER1_NAME: ''
  NEXT_PUBLIC_SPECIFIEDLINEUSER2: ""
  NEXT_PUBLIC_SPECIFIEDLINEUSER2_NAME: ''
  NEXTAUTH_URL: ""
  GOOGLE_APPLICATION_CREDENTIALS: ""
  APIENDPOINT: "http://api-service:80"

